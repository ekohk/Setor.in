{{define "order_cancelled"}}{{template "header" .}}
<div style="text-align:center;padding:6px 0 16px 0;">
  <span style="display:inline-block;padding:6px 14px;background-color:#fbe9e7;color:#9c2a1f;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;border-radius:999px;">Dibatalkan</span>
</div>

<h1 style="margin:0 0 10px 0;font-size:22px;font-weight:700;letter-spacing:-0.025em;color:#131815;">Order dibatalkan</h1>
<p style="margin:0 0 18px 0;font-size:14px;line-height:1.6;color:#2f3833;">
  Halo {{.FullName}}, order <strong>{{.OrderCode}}</strong> telah dibatalkan.
</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:14px 0;">
  <tr><td style="background-color:#fbe9e7;border-left:3px solid #9c2a1f;border-radius:0 12px 12px 0;padding:14px 16px;">
    <div style="font-size:10px;color:#9c2a1f;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;">Alasan</div>
    <div style="font-size:13px;color:#131815;line-height:1.5;">{{.Reason}}</div>
  </td></tr>
</table>

<p style="margin:18px 0 0 0;font-size:13px;color:#6e776f;line-height:1.5;">
  Anda bisa membuat order baru kapan saja melalui aplikasi.
</p>
{{template "footer" .}}{{end}}
