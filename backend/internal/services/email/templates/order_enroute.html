{{define "order_enroute"}}{{template "header" .}}
<div style="text-align:center;padding:8px 0 14px 0;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
    <tr><td style="width:64px;height:64px;background-color:#ccfbf1;border-radius:18px;text-align:center;vertical-align:middle;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
        <path d="M3 7h11v9H3zM14 11h4l3 3v2h-7" stroke="#0f766e" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="7" cy="18" r="2" stroke="#0f766e" stroke-width="2"/>
        <circle cx="17" cy="18" r="2" stroke="#0f766e" stroke-width="2"/>
      </svg>
    </td></tr>
  </table>
</div>

<h1 style="margin:0 0 10px 0;font-size:22px;font-weight:700;letter-spacing:-0.025em;color:#131815;text-align:center;">Driver sedang menuju lokasi</h1>
<p style="margin:0 0 18px 0;font-size:14px;line-height:1.6;color:#6e776f;text-align:center;">
  Halo {{.FullName}}, driver collector berangkat ke alamat Anda untuk order
  <strong style="color:#131815;">{{.OrderCode}}</strong>.
</p>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:14px 0;">
  <tr><td style="background-color:#ccfbf1;border-radius:12px;padding:14px 16px;font-size:13px;color:#0f766e;line-height:1.5;text-align:center;">
    Siapkan barang Anda di tempat yang mudah ditimbang.
  </td></tr>
</table>
{{template "footer" .}}{{end}}
