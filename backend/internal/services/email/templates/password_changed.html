{{define "password_changed"}}{{template "header" .}}
<div style="text-align:center;padding:8px 0 14px 0;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center">
    <tr><td style="width:64px;height:64px;background-color:#e6f0fb;border-radius:18px;text-align:center;vertical-align:middle;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
        <rect x="5" y="11" width="14" height="9" rx="2" stroke="#1e5a96" stroke-width="2"/>
        <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="#1e5a96" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="15.5" r="1.4" fill="#1e5a96"/>
      </svg>
    </td></tr>
  </table>
</div>

<h1 style="margin:0 0 10px 0;font-size:22px;font-weight:700;letter-spacing:-0.025em;color:#131815;text-align:center;">Password berhasil diubah</h1>
<p style="margin:0 0 20px 0;font-size:14px;line-height:1.6;color:#6e776f;text-align:center;">
  Halo {{.FullName}}, password akun Setor.in Anda baru saja diperbarui.
</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 0 0;background-color:#f6f6f3;border-radius:12px;">
  <tr><td style="padding:14px 18px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td style="font-size:13px;color:#6e776f;padding:4px 0;width:35%;">Waktu</td>
        <td style="font-size:13px;color:#131815;font-weight:600;padding:4px 0;">{{.ChangedAt}}</td>
      </tr>
      {{if .IPAddress}}
      <tr>
        <td style="font-size:13px;color:#6e776f;padding:4px 0;">IP Address</td>
        <td style="font-size:13px;color:#131815;font-weight:600;padding:4px 0;">{{.IPAddress}}</td>
      </tr>
      {{end}}
    </table>
  </td></tr>
</table>
{{template "footer" .}}{{end}}
